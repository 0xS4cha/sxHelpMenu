name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the interface
        working-directory: web
        run: npm ci && npm run build
      - name: Package the resource
        run: |
          mkdir -p build/sxHelpMenu
          git ls-files | grep -vE '^(previews|tests|\.github)/' | xargs cp --parents -t build/sxHelpMenu
          cp -r web/dist build/sxHelpMenu/web/dist
          cd build && zip -qr ../sxHelpMenu.zip sxHelpMenu
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" sxHelpMenu.zip --clobber
          else
            gh release create "$TAG" sxHelpMenu.zip --draft --title "sxHelpMenu $TAG" --notes ""
          fi
